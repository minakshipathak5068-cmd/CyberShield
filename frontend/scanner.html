<!DOCTYPE html>
<html>
<head>
    <title>CyberShield - Scanner</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <h1>Message Scanner</h1>

    <textarea
        id="messageInput"
        placeholder="Enter a message to scan">
    </textarea>

    <button id="scanBtn">
        Scan Message
    </button>

    <h3>Result:</h3>

    <p id="scanResult"></p>

    <button onclick="window.location.href='history.html'">
        View History
    </button>

    <button onclick="window.location.href='home.html'">
        Home
    </button>

</div>

<script type="module" src="js/scanner.js"></script>

</body>
</html>
